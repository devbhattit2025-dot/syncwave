name: Build SyncWave Multi-Platform (Android APK & iOS IPA)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Show Xcode Version & Available SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -list -project SyncWave.xcodeproj

      - name: Build iOS Application
        run: |
          set +e
          xcodebuild clean build \
            -project SyncWave.xcodeproj \
            -scheme SyncWave \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            VALIDATE_PRODUCT=NO \
            ENABLE_PREVIEWS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO > build_log.txt 2>&1
          BUILD_CODE=$?
          echo "Build finished with exit code: $BUILD_CODE"
          
          if [ $BUILD_CODE -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-logs
            cp build_log.txt failure_log.txt
            git add failure_log.txt
            git commit -m "Upload failure log [skip ci]"
            git push -f origin build-logs
            echo "::error::Xcode build failed! Log pushed to build-logs branch"
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ./build -name "SyncWave.app" -type d | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: SyncWave.app not found!"
            exit 1
          fi
          cp -r "$APP_PATH" ./Payload/
          zip -r -y SyncWave.ipa Payload
          ls -lh SyncWave.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncWave-iOS-IPA
          path: SyncWave.ipa
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradlew
        working-directory: ./android
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Build Android Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon

      - name: Copy & Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk SyncWave-Android.apk || cp android/app/build/outputs/apk/release/app-release.apk SyncWave-Android.apk
          ls -lh SyncWave-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncWave-Android-APK
          path: SyncWave-Android.apk
          retention-days: 14

  release:
    name: Publish Cross-Platform GitHub Release
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: SyncWave-iOS-IPA
          path: ./dist

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: SyncWave-Android-APK
          path: ./dist

      - name: List Release Files
        run: ls -lh ./dist

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "SyncWave Mesh v2.0.0 (Android APK & iOS IPA)"
          body: |
            # 🚀 SyncWave Mesh v2.0.0 (Multi-Phone Sound Booster)
            
            Play songs across multiple Android & iOS phones simultaneously with **zero subscription** and **zero audio delay** (like Spotify Jam / AmpMe)!
            
            ---
            
            ### 📥 Direct Downloads:
            - 📱 **Android APK**: [`SyncWave-Android.apk`](https://github.com/devbhattit2025-dot/syncwave/releases/download/v2.0.0/SyncWave-Android.apk) *(1-Click Direct Install on any Android phone)*
            - 🍏 **iOS IPA**: [`SyncWave.ipa`](https://github.com/devbhattit2025-dot/syncwave/releases/download/v2.0.0/SyncWave.ipa) *(For iPhone sideloading via Sideloadly / AltStore)*
            
            ---
            
            ### ⚡ Features:
            - **Sub-Millisecond NTP Clock Sync**: Zero echo or delay between phones.
            - **Room Sound Multiplier**: Multiply total room volume by using all phones as speaker nodes.
            - **Role Assignment**: Max Sound Booster, Left Channel, Right Channel, Subwoofer Box, Vocal Clarity.
            - **Instant QR Code Joining**: Friends can scan the QR code to sync instantly.
          files: |
            dist/SyncWave.ipa
            dist/SyncWave-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
