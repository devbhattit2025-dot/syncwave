name: Build SyncWave IPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Show Xcode Version & Available SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -list -project SyncWave.xcodeproj

      - name: Build iOS Application
        run: |
          set +e
          xcodebuild clean build \
            -project SyncWave.xcodeproj \
            -scheme SyncWave \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            VALIDATE_PRODUCT=NO \
            ENABLE_PREVIEWS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO > build_log.txt 2>&1
          BUILD_CODE=$?
          echo "Build finished with exit code: $BUILD_CODE"
          
          if [ $BUILD_CODE -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-logs
            cp build_log.txt failure_log.txt
            git add failure_log.txt
            git commit -m "Upload failure log [skip ci]"
            git push -f origin build-logs
            echo "::error::Xcode build failed! Log pushed to build-logs branch"
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ./build -name "SyncWave.app" -type d | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: SyncWave.app not found!"
            exit 1
          fi
          cp -r "$APP_PATH" ./Payload/
          zip -r -y SyncWave.ipa Payload
          ls -lh SyncWave.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncWave-IPA
          path: SyncWave.ipa
          retention-days: 14
