# Trigger build: v1.0.1
name: Build SyncWave IPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version & Schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project SyncWave.xcodeproj

      - name: Build Ad-Hoc App
        run: |
          xcodebuild build \
            -project SyncWave.xcodeproj \
            -scheme SyncWave \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          cp -r ./build/Build/Products/Release-iphoneos/SyncWave.app ./Payload/
          zip -r -y SyncWave.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncWave-IPA
          path: SyncWave.ipa
          retention-days: 14
