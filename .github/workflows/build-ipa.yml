name: Build SyncWave IPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version & Available SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -list -project SyncWave.xcodeproj

      - name: Build iOS Application
        run: |
          set -e
          xcodebuild clean build \
            -project SyncWave.xcodeproj \
            -scheme SyncWave \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            VALIDATE_PRODUCT=NO \
            ENABLE_PREVIEWS=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ./build/Build/Products -name "SyncWave.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" ./Payload/
          zip -r -y SyncWave.ipa Payload
          ls -la SyncWave.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncWave-IPA
          path: SyncWave.ipa
          retention-days: 14
